<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>AttendEase Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --bg: #F5F6FB;
      --surface: #FFFFFF;
      --surface-2: #F0F1F8;
      --border: #E3E5F1;
      --text: #191C2E;
      --text-muted: #6C7189;
      --text-faint: #9599B0;
      --primary: #5B4CF5;
      --primary-dark: #4636D6;
      --primary-soft: #EDEBFE;
      --present: #0FA968;
      --present-soft: #E3F9EF;
      --absent: #F0435E;
      --absent-soft: #FDE7EB;
      --leave: #F5A524;
      --leave-soft: #FEF2DD;
      --half: #0EA5E9;
      --half-soft: #E3F4FC;
      --late: #9333EA;
      --late-soft: #F2E6FB;
      --shadow: 0 1px 2px rgba(20, 20, 50, .04), 0 8px 24px -8px rgba(20, 20, 50, .10);
      --radius: 16px;
    }

    .dark {
      --bg: #0D0F1D;
      --surface: #161927;
      --surface-2: #1E2233;
      --border: #2A2E42;
      --text: #EDEEF7;
      --text-muted: #9599B5;
      --text-faint: #6C7189;
      --primary: #7C6DFB;
      --primary-dark: #6355E8;
      --primary-soft: #26224A;
      --present: #2ED08C;
      --present-soft: #132A22;
      --absent: #FB5F79;
      --absent-soft: #2E1620;
      --leave: #FBB94E;
      --leave-soft: #2E250F;
      --half: #38BDF8;
      --half-soft: #0F2432;
      --late: #C084FC;
      --late-soft: #241533;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -8px rgba(0, 0, 0, .5);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: background .2s, color .2s;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: 'Lexend', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: .875rem;
      border-radius: 12px;
      padding: .55rem 1rem;
      transition: all .12s;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--surface-2);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-danger {
      background: var(--absent-soft);
      color: var(--absent);
    }

    .btn-danger:hover {
      filter: brightness(.95);
    }

    .btn-sm {
      padding: .35rem .7rem;
      font-size: .78rem;
      border-radius: 9px;
    }

    input,
    select,
    textarea {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .55rem .75rem;
      font-size: .875rem;
      color: var(--text);
      width: 100%;
      outline: none;
      transition: border .12s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .72rem;
      font-weight: 700;
      padding: .25rem .6rem;
      border-radius: 999px;
    }

    .side-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: .65rem .9rem;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: .875rem;
      cursor: pointer;
      transition: all .12s;
    }

    .side-link:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .side-link.active {
      background: var(--primary);
      color: #fff;
    }

    .side-link.active svg {
      stroke: #fff;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }

    th {
      text-align: left;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-faint);
      font-weight: 700;
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: .65rem .75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 25, .55);
      backdrop-filter: blur(2px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn .15s ease;
    }

    .modal-box {
      background: var(--surface);
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
      animation: pop .15s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.96) translateY(8px)
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 14px;
      padding: .75rem 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .85rem;
      font-weight: 500;
      animation: slideUp .2s ease;
      min-width: 260px;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .att-pill {
      flex: 1;
      min-width: 56px;
      text-align: center;
      padding: .4rem .3rem;
      border-radius: 10px;
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      transition: all .1s;
      user-select: none;
    }

    .att-pill:hover {
      transform: translateY(-1px);
    }

    .att-pill.sel-present {
      background: var(--present);
      border-color: var(--present);
      color: #fff;
    }

    .att-pill.sel-absent {
      background: var(--absent);
      border-color: var(--absent);
      color: #fff;
    }

    .att-pill.sel-leave {
      background: var(--leave);
      border-color: var(--leave);
      color: #fff;
    }

    .att-pill.sel-half {
      background: var(--half);
      border-color: var(--half);
      color: #fff;
    }

    .att-pill.sel-late {
      background: var(--late);
      border-color: var(--late);
      color: #fff;
    }

    .tab-btn {
      padding: .5rem 1rem;
      border-radius: 10px;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .avatar-fallback {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .78rem;
      color: #fff;
      flex-shrink: 0;
    }

    #sidebar {
      transition: transform .2s ease;
    }

    @media(min-width:1024px) {
      #sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
    }

    .day-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
    }

    @media(max-width:1023px) {
      #sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 270px;
        z-index: 50;
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        z-index: 45;
      }

      #sidebar-overlay.open {
        display: block;
      }
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    input[type=file] {
      padding: .4rem;
      font-size: .78rem;
    }

    ::placeholder {
      color: var(--text-faint);
    }
  </style>
</head>

<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4"
    style="background:radial-gradient(circle at 20% 20%, var(--primary-soft), var(--bg) 55%)">
    <div class="w-full max-w-sm">
      <div class="flex items-center gap-2 justify-center mb-8">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--primary)"><i
            data-lucide="check-check" class="text-white" style="width:20px;height:20px"></i></div>
        <span class="font-display font-bold text-xl">AttendEase <span style="color:var(--primary)">Pro</span></span>
      </div>
      <div class="card p-7">
        <h1 class="font-display font-bold text-xl mb-1" id="auth-title">Welcome back</h1>
        <p class="text-sm mb-5" style="color:var(--text-muted)" id="auth-sub">Sign in to your attendance dashboard</p>
        <div class="space-y-3" id="auth-signup-name-wrap" style="display:none">
          <div><label>Full name</label><input id="auth-name" placeholder="e.g. Anita Sharma"></div>
          <div><label>School / Institute name</label><input id="auth-school"
              placeholder="e.g. Green Valley Public School"></div>
        </div>
        <div class="space-y-3 mt-3">
          <div><label>Email address</label><input id="auth-email" placeholder="you@school.edu" type="email"></div>
          <div><label>Password</label><input id="auth-pass" placeholder="••••••••" type="password"></div>
        </div>
        <button class="btn btn-primary w-full justify-center mt-5" onclick="App.authSubmit()"><i data-lucide="log-in"
            style="width:16px;height:16px"></i><span id="auth-btn-label">Sign In</span></button>
        <p class="text-center text-sm mt-4" style="color:var(--text-muted)">
          <span id="auth-toggle-text">Don't have an account?</span>
          <a class="font-semibold cursor-pointer" style="color:var(--primary)" onclick="App.toggleAuthMode()"
            id="auth-toggle-link">Sign up</a>
        </p>
        <button class="btn btn-outline w-full justify-center mt-3" onclick="App.demoLogin()"><i data-lucide="sparkles"
            style="width:15px;height:15px"></i>Continue with Demo Account</button>
      </div>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" style="display:none">
    <div id="sidebar-overlay" onclick="App.closeSidebar()"></div>
    <div class="flex min-h-screen">
      <aside id="sidebar" class="w-[260px] flex-shrink-0 flex flex-col p-4"
        style="background:var(--surface);border-right:1px solid var(--border)">
        <div class="flex items-center gap-2 px-2 mb-6 mt-1">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--primary)"><i
              data-lucide="check-check" class="text-white" style="width:18px;height:18px"></i></div>
          <span class="font-display font-bold text-lg">AttendEase <span style="color:var(--primary)">Pro</span></span>
          <button class="btn-ghost btn ml-auto lg:hidden p-1" onclick="App.closeSidebar()"><i data-lucide="x"
              style="width:18px;height:18px"></i></button>
        </div>
        <nav class="flex-1 space-y-1 overflow-y-auto" id="nav-links"></nav>
        <div class="pt-3 mt-2" style="border-top:1px solid var(--border)">
          <div class="flex items-center gap-2 px-2 py-2">
            <div class="avatar-fallback" style="background:var(--primary)" id="sb-avatar">U</div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold truncate" id="sb-name">User</p>
              <p class="text-xs truncate" style="color:var(--text-muted)" id="sb-email">user@school.edu</p>
            </div>
            <button class="btn-ghost btn p-1.5" title="Logout" onclick="App.logout()"><i data-lucide="log-out"
                style="width:16px;height:16px"></i></button>
          </div>
        </div>
      </aside>

      <main class="flex-1 min-w-0">
        <header class="flex items-center gap-3 px-4 lg:px-7 py-3.5 sticky top-0 z-30"
          style="background:var(--bg);border-bottom:1px solid var(--border)">
          <button class="btn-ghost btn p-2 lg:hidden" onclick="App.openSidebar()"><i data-lucide="menu"
              style="width:20px;height:20px"></i></button>
          <h1 class="font-display font-bold text-lg lg:text-xl" id="page-title">Dashboard</h1>
          <div class="ml-auto flex items-center gap-2">
            <div class="relative hidden sm:block">
              <i data-lucide="search" style="width:15px;height:15px" class="absolute left-3 top-1/2 -translate-y-1/2"
                style="color:var(--text-faint)"></i>
              <input id="global-search" placeholder="Search students..." class="pl-8 !w-56"
                oninput="App.globalSearch(this.value)">
              <div id="global-search-results" class="absolute right-0 mt-2 w-72 card p-2 hidden z-40"></div>
            </div>
            <button class="btn-ghost btn p-2" onclick="App.toggleTheme()" title="Toggle theme"><i data-lucide="moon"
                id="theme-icon" style="width:18px;height:18px"></i></button>
          </div>
        </header>
        <div id="page-content" class="p-4 lg:p-7"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[80] flex flex-col gap-2 items-end"></div>

  <script>
    /* =========================================================================
       ATTENDEASE PRO — self-contained prototype (LocalStorage only)
       ========================================================================= */
    const STORAGE_KEY = 'attendease_pro_v1';
    const SESSION_KEY = 'attendease_pro_session';
    const LAST_PAGE_KEY = 'attendease_pro_last_page';
    const STATUS_META = {
      present: { label: 'Present', abbr: 'P', color: 'present' },
      absent: { label: 'Absent', abbr: 'A', color: 'absent' },
      leave: { label: 'Leave', abbr: 'L', color: 'leave' },
      half: { label: 'Half Day', abbr: 'H', color: 'half' },
      late: { label: 'Late', abbr: 'Lt', color: 'late' },
    };
    const AVATAR_COLORS = ['#5B4CF5', '#0FA968', '#F5A524', '#0EA5E9', '#9333EA', '#F0435E', '#14B8A6', '#EA580C'];
    const STREAM_SUBJECTS = {
      Arts: ['History', 'Political Science', 'Geography', 'Economics', 'Psychology', 'Sociology', 'Philosophy', 'Fine Arts / Music', 'Physical Education', 'Information Technology'],
      Commerce: ['Accountancy', 'Business Studies', 'Economics', 'English', 'Mathematics', 'Computer Science', 'Information Technology', 'Physical Education'],
      Medical: ['Physics', 'Chemistry', 'Biology'],
      'Non-Medical': ['Physics', 'Chemistry', 'Maths', 'Computer Science', 'Information Technology'],
    };
    const EXAM_TYPES = ['Unit Test 1', 'Unit Test 2', 'Unit Test 3', 'Midterm', 'Pre-Board', 'Final Exam / Board'];
    function isStreamClass(classId) {
      const cl = DATA.classes.find(c => c.id === classId);
      return !!(cl && /\b(11|12)\b/.test(cl.name));
    }
    function streamFieldHtml(s) {
      const cl0 = DATA.classes.find(c => c.id === (s?.classId || DATA.classes[0]?.id));
      const show = cl0 && /\b(11|12)\b/.test(cl0.name);
      return `<div class="col-span-2" id="stream-field-wrap" style="${show ? '' : 'display:none'}">
      <label>Stream</label>
      <select id="f-stream" onchange="App.renderStreamSubjects(this.value)">
        <option value="">Select stream…</option>
        ${Object.keys(STREAM_SUBJECTS).map(k => `<option value="${k}" ${s?.stream === k ? 'selected' : ''}>${k}</option>`).join('')}
      </select>
      <div id="stream-subjects-preview" class="mt-2 flex flex-wrap gap-1">${(s?.stream ? STREAM_SUBJECTS[s.stream] : []).map(sub => `<span class="pill" style="background:var(--primary-soft);color:var(--primary)">${sub}</span>`).join('')}</div>
    </div>`;
    }
    function renderStreamSubjects(stream) {
      const box = document.getElementById('stream-subjects-preview'); if (!box) return;
      box.innerHTML = (STREAM_SUBJECTS[stream] || []).map(sub => `<span class="pill" style="background:var(--primary-soft);color:var(--primary)">${sub}</span>`).join('');
    }
    function toggleStreamFieldForClass(classId) {
      const wrap = document.getElementById('stream-field-wrap'); if (!wrap) return;
      wrap.style.display = isStreamClass(classId) ? '' : 'none';
    }

    let DATA = null;
    let SESSION = null;
    let UI = {
      page: 'dashboard', theme: 'light',
      attendance: { classId: null, date: todayStr(), session: 'single' },
      studentsPage: 1, studentsSearch: '', studentsFilterClass: 'all',
      reportsTab: 'class', deletedStudentBackup: null
    };

    function todayStr(d) { d = d || new Date(); return d.toISOString().slice(0, 10); }
    function uid(p) { return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9); }
    function fmtDate(s) { const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
    function fmtDateShort(s) { const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }); }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
    function icons() { if (window.lucide) lucide.createIcons(); }
    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function initials(name) { return (name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
    function colorFor(seed) { let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }

    /* ---------- Toasts ---------- */
    function toast(msg, opts) {
      opts = opts || {};
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<i data-lucide="${opts.icon || 'check-circle-2'}" style="width:17px;height:17px;color:${opts.color || 'var(--present)'}"></i><span class="flex-1">${esc(msg)}</span>`;
      if (opts.actionLabel) {
        const btn = document.createElement('button');
        btn.className = 'font-bold text-xs'; btn.style.color = 'var(--primary)'; btn.textContent = opts.actionLabel;
        btn.onclick = () => { opts.onAction && opts.onAction(); el.remove(); };
        el.appendChild(btn);
      }
      root.appendChild(el); icons();
      setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, opts.duration || 3200);
    }
    function addActivity(text, icon) {
      DATA.activity.unshift({ id: uid('act'), text, icon: icon || 'activity', ts: new Date().toISOString() });
      DATA.activity = DATA.activity.slice(0, 40);
    }

    /* ---------- Seed Data ---------- */
    function seedData() {
      const classes = [
        { id: 'c1', name: 'Class 5', section: 'A', sessionMode: 'single' },
        { id: 'c2', name: 'Class 6', section: 'B', sessionMode: 'both' },
        { id: 'c3', name: 'Class 7', section: 'C', sessionMode: 'single' },
      ];
      const firstNames = ['Aarav', 'Vivaan', 'Aditya', 'Ishaan', 'Reyansh', 'Ananya', 'Diya', 'Saanvi', 'Myra', 'Kiara', 'Rohan', 'Kabir', 'Aryan', 'Sara', 'Pihu', 'Advika', 'Vihaan', 'Neha', 'Riya', 'Arjun'];
      const lastNames = ['Sharma', 'Verma', 'Gupta', 'Iyer', 'Khan', 'Patel', 'Reddy', 'Nair', 'Joshi', 'Malhotra'];
      const students = []; let roll = 1;
      classes.forEach((cl, ci) => {
        const n = ci === 0 ? 6 : ci === 1 ? 7 : 6;
        for (let i = 0; i < n; i++) {
          const name = firstNames[(ci * 7 + i) % firstNames.length] + ' ' + lastNames[(ci * 3 + i) % lastNames.length];
          students.push({
            id: uid('stu'), name, roll: roll++, classId: cl.id, photo: null,
            parentName: lastNames[(ci + i) % lastNames.length] + ' ' + (i % 2 ? 'Kumar' : 'Devi') + ' (Parent)',
            parentPhone: '91' + (9000000000 + Math.floor(Math.random() * 99999999)),
            feeTotal: 12000, feePaid: i % 3 === 0 ? 12000 : (i % 3 === 1 ? 6000 : 0),
            feeDue: todayStr(new Date(Date.now() + (i % 2 ? -5 : 20) * 86400000)),
          });
        }
      });
      const holidays = [
        { id: uid('hol'), date: currentYearDate(8, 15), reason: 'Independence Day' },
        { id: uid('hol'), date: currentYearDate(10, 2), reason: 'Gandhi Jayanti' },
        { id: uid('hol'), date: currentYearDate(11, 1), reason: 'Diwali' },
      ];
      // attendance for last 14 days
      const attendance = {};
      const holSet = new Set(holidays.map(h => h.date));
      for (let back = 13; back >= 0; back--) {
        const d = new Date(); d.setDate(d.getDate() - back);
        const ds = todayStr(d);
        const dow = d.getDay();
        if (holSet.has(ds) || dow === 0) continue; // skip holidays & Sundays for seed realism
        attendance[ds] = {};
        classes.forEach(cl => {
          const sessions = cl.sessionMode === 'both' ? ['morning', 'evening'] : ['single'];
          attendance[ds][cl.id] = {};
          sessions.forEach(sess => {
            const rec = {};
            students.filter(s => s.classId === cl.id).forEach(s => {
              const r = Math.random();
              rec[s.id] = r < 0.82 ? 'present' : r < 0.90 ? 'absent' : r < 0.95 ? 'leave' : r < 0.98 ? 'half' : 'late';
            });
            attendance[ds][cl.id][sess] = rec;
          });
        });
      }
      const subjects = [{ id: 'sub1', name: 'Mathematics' }, { id: 'sub2', name: 'Science' }, { id: 'sub3', name: 'English' }, { id: 'sub4', name: 'Social Studies' }];
      const marks = [];
      students.forEach(s => {
        subjects.forEach(sub => {
          marks.push({ id: uid('mk'), studentId: s.id, subjectId: sub.id, examType: 'Midterm', score: 40 + Math.floor(Math.random() * 60), maxScore: 100 });
        });
      });
      const leaves = [
        { id: uid('lv'), studentId: students[0].id, from: todayStr(new Date(Date.now() - 2 * 86400000)), to: todayStr(new Date(Date.now() - 1 * 86400000)), type: 'Sick Leave', reason: 'Fever', status: 'Approved', appliedOn: todayStr(new Date(Date.now() - 3 * 86400000)) },
        { id: uid('lv'), studentId: students[5]?.id || students[0].id, from: todayStr(new Date(Date.now() + 1 * 86400000)), to: todayStr(new Date(Date.now() + 2 * 86400000)), type: 'Casual Leave', reason: 'Family function', status: 'Pending', appliedOn: todayStr() },
      ];
      DATA = {
        meta: { schoolName: 'Green Valley Public School', logo: null, theme: 'light', developerName: 'Your Name' },
        classes, students, holidays, attendance, leaves, subjects, marks,
        activity: [{ id: uid('act'), text: 'Sample data loaded — 19 students across 3 classes', icon: 'sparkles', ts: new Date().toISOString() }]
      };
      save();
    }
    function currentYearDate(m, day) { const y = new Date().getFullYear(); return `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { try { DATA = JSON.parse(raw); } catch (e) { seedData(); } }
      else seedData();
      if (!DATA.leaves) DATA.leaves = [];
      if (!DATA.subjects) DATA.subjects = [];
      if (!DATA.marks) DATA.marks = [];
      if (!DATA.activity) DATA.activity = [];
    }

    /* ---------- Holiday helpers ---------- */
    function isHoliday(dateStr) { return DATA.holidays.find(h => h.date === dateStr); }
    function holidaySet() { return new Set(DATA.holidays.map(h => h.date)); }

    /* ---------- Auth ---------- */
    let authMode = 'signin';
    function toggleAuthMode() {
      authMode = authMode === 'signin' ? 'signup' : 'signin';
      document.getElementById('auth-signup-name-wrap').style.display = authMode === 'signup' ? 'block' : 'none';
      document.getElementById('auth-title').textContent = authMode === 'signup' ? 'Create your account' : 'Welcome back';
      document.getElementById('auth-sub').textContent = authMode === 'signup' ? 'Set up your school workspace' : 'Sign in to your attendance dashboard';
      document.getElementById('auth-btn-label').textContent = authMode === 'signup' ? 'Create Account' : 'Sign In';
      document.getElementById('auth-toggle-text').textContent = authMode === 'signup' ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('auth-toggle-link').textContent = authMode === 'signup' ? 'Sign in' : 'Sign up';
    }
    function authSubmit() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();
      if (!email || !pass) { toast('Please enter email and password', { icon: 'alert-circle', color: 'var(--absent)' }); return; }
      let name = document.getElementById('auth-name')?.value.trim();
      if (authMode === 'signup') {
        if (!name) { toast('Please enter your full name', { icon: 'alert-circle', color: 'var(--absent)' }); return; }
        const school = document.getElementById('auth-school').value.trim();
        if (school) { loadData(); DATA.meta.schoolName = school; save(); }
      }
      if (!name) name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      SESSION = { name, email };
      localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
      enterApp();
    }
    function demoLogin() {
      SESSION = { name: 'Demo Admin', email: 'admin@greenvalley.edu' };
      localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
      enterApp();
    }
    function logout() {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
    }
    function enterApp() {
      loadData();
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'block';
      document.getElementById('sb-name').textContent = SESSION.name;
      document.getElementById('sb-email').textContent = SESSION.email;
      document.getElementById('sb-avatar').textContent = initials(SESSION.name);
      document.getElementById('sb-avatar').style.background = colorFor(SESSION.email);

    }

    /* ---------- Nav / Shell ---------- */
    const NAV_ITEMS = [
      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
      { id: 'students', label: 'Students', icon: 'users' },
      { id: 'classes', label: 'Classes', icon: 'school' },
      { id: 'attendance', label: 'Attendance', icon: 'calendar-check-2' },
      { id: 'leave', label: 'Leave', icon: 'plane' },
      { id: 'marks', label: 'Marks', icon: 'graduation-cap' },
      { id: 'fees', label: 'Fees', icon: 'wallet' },

    function buildNav() {
      document.getElementById('nav-links').innerHTML = NAV_ITEMS.map(it =>
        `<div class="side-link" id="nav-${it.id}" onclick="App.nav('${it.id}')"><i data-lucide="${it.icon}" style="width:17px;height:17px"></i><span>${it.label}</span></div>`

    function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }

    function toggleTheme() { const next = DATA.meta.theme === 'dark' ? 'light' : 'dark'; applyTheme(next); save(); }
    function applyTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
    function openModal(html) { document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) App.closeModal()"><div class="modal-box">${html}</div></div>`; icons(); }

    /* ---------- Global Search ---------- */
    function globalSearch(q) {
      const box = document.getElementById('global-search-results');
      q = q.trim().toLowerCase();
      if (!q) { box.classList.add('hidden'); return; }
      const res = DATA.students.filter(s => s.name.toLowerCase().includes(q) || String(s.roll).includes(q)).slice(0, 6);
      box.innerHTML = res.length ? res.map(s => {
        const cl = DATA.classes.find(c => c.id === s.classId);
        return `<div class="p-2 rounded-lg cursor-pointer flex items-center gap-2 hover:opacity-80" style="hover:background:var(--surface-2)" onclick="App.viewStudent('${s.id}')">

    </div>`;
      }).join('') : `<div class="p-3 text-sm text-center" style="color:var(--text-muted)">No students found</div>`;

    document.addEventListener('click', e => {
      if (!e.target.closest('#global-search') && !e.target.closest('#global-search-results')) document.getElementById('global-search-results')?.classList.add('hidden');
    });
    /* ---------- Enter key = Save, everywhere ---------- */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const tag = e.target.tagName;
      if (tag !== 'INPUT' && tag !== 'SELECT') return; // let textareas keep normal newline behavior
      if (e.target.closest('#auth-screen')) { e.preventDefault(); authSubmit(); return; }
      const modalBox = e.target.closest('.modal-box');
      if (modalBox) {
        const saveBtn = modalBox.querySelector('.btn-primary');
        if (saveBtn) { e.preventDefault(); saveBtn.click(); }
        return;
      }
      if (e.target.id === 'set-school' || e.target.id === 'set-dev') { e.preventDefault(); saveSettings(); return; }
    });
    /* ---------- Enter key = Save, everywhere ---------- */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'TEXTAREA' || tag === 'BUTTON' || e.target.isContentEditable) return;
      const modalBox = e.target.closest('.modal-box');
      if (modalBox) {
        const btn = modalBox.querySelector('.btn-primary');
        if (btn) { e.preventDefault(); btn.click(); }
        return;
      }
      if (e.target.closest('#auth-screen')) { e.preventDefault(); authSubmit(); return; }
      if (e.target.closest('#settings-form')) { e.preventDefault(); saveSettings(); return; }
    });
    function avatarHtml(s, size) {
      size = size || 36;
      if (s.photo) return `<img src="${s.photo}" class="avatar" style="width:${size}px;height:${size}px">`;
      return `<div class="avatar-fallback" style="width:${size}px;height:${size}px;background:${colorFor(s.name)};font-size:${size * 0.35}px">${initials(s.name)}</div>`;
    }

    /* =========================================================================
       DASHBOARD
       ========================================================================= */
    function renderDashboard() {
      const today = todayStr();
      const hol = isHoliday(today);
      let present = 0, absent = 0, leave = 0, half = 0, late = 0, marked = 0;
      if (!hol) {
        Object.values(DATA.attendance[today] || {}).forEach(classSessions => {
          Object.values(classSessions).forEach(rec => {
            Object.values(rec).forEach(st => {
              marked++;
              if (st === 'present') present++; else if (st === 'absent') absent++; else if (st === 'leave') leave++; else if (st === 'half') half++; else if (st === 'late') late++;
            });
          });
        });
      }
      const pct = marked ? Math.round(((present + half * 0.5) / marked) * 100) : 0;

      const el = document.getElementById('page-content');
      el.innerHTML = `
  <div class="flex flex-col sm:flex-row sm:items-center gap-2 mb-5">
    <div>
      <h2 class="font-display font-bold text-2xl">Hi ${esc(SESSION.name.split(' ')[0])} 👋</h2>
      <p class="text-sm" style="color:var(--text-muted)">Here's what's happening at ${esc(DATA.meta.schoolName)} today.</p>
    </div>
    <button class="btn btn-primary sm:ml-auto" onclick="App.nav('attendance')"><i data-lucide="calendar-check-2" style="width:15px;height:15px"></i>Mark Today's Attendance</button>
  </div>
  ${hol ? `<div class="card p-3 mb-5 flex items-center gap-2" style="background:var(--leave-soft);border-color:var(--leave)"><i data-lucide="party-popper" style="width:16px;height:16px;color:var(--leave)"></i><span class="text-sm font-semibold">Today is a holiday — ${esc(hol.reason)}</span></div>` : ''}
  <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
    ${statCard('Total Students', DATA.students.length, 'users', 'var(--primary)')}
    ${statCard('Total Classes', DATA.classes.length, 'school', 'var(--half)')}
    ${statCard("Today's Attendance", pct + '%', 'trending-up', 'var(--present)')}
    ${statCard('Present / Absent', present + ' / ' + absent, 'user-check', 'var(--present)')}
    ${statCard('On Leave', leave + half + late, 'plane', 'var(--leave)')}
  </div>
  <div class="grid lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-display font-bold">Attendance Trend — Last 14 Days</h3>
      </div>
      <canvas id="trendChart" height="110"></canvas>
    </div>
    <div class="card p-5">
      <h3 class="font-display font-bold mb-3">Recent Activity</h3>
      <div class="space-y-3 max-h-[280px] overflow-y-auto pr-1">
        ${DATA.activity.slice(0, 10).map(a => `
          <div class="flex items-start gap-2.5">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style="background:var(--primary-soft)"><i data-lucide="${a.icon || 'activity'}" style="width:13px;height:13px;color:var(--primary)"></i></div>
            <div class="min-w-0"><p class="text-sm">${esc(a.text)}</p><p class="text-xs" style="color:var(--text-faint)">${new Date(a.ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</p></div>
          </div>`).join('') || `<p class="text-sm" style="color:var(--text-muted)">No activity yet.</p>`}
      </div>
    </div>
  </div>
  <div class="grid lg:grid-cols-2 gap-5 mt-5">
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-display font-bold">Student Performance</h3>
        <button class="btn btn-outline btn-sm" onclick="App.nav('reports');App.reportsTabGo('leaderboard')">View Full Leaderboard</button>
      </div>
      ${dashboardPerformanceHtml()}
    </div>
    <div class="card p-5">
      <h3 class="font-display font-bold mb-1">14-Day Pulse</h3>
      <p class="text-xs mb-3" style="color:var(--text-muted)">Each dot = one of the last 14 days' overall attendance. Green &gt;85% present, Yellow 60–85%, Red &lt;60%, Purple = holiday, Grey = not marked. Hover a dot for the date.</p>
      <div class="flex gap-1.5 flex-wrap">${pulseStrip()}</div>
    </div>
  </div>`;
      renderTrendChart();
    }
    function dashboardPerformanceHtml() {
      const rows = DATA.students.map(s => ({ s, st: studentAttendanceStats(s.id) })).filter(r => r.st.total > 0).sort((a, b) => b.st.pct - a.st.pct);
      if (!rows.length) return `<p class="text-sm" style="color:var(--text-muted)">No attendance data yet to rank students.</p>`;
      const top = rows.slice(0, 5);
      return `<div class="space-y-2">${top.map((r, i) => {
        const cl = DATA.classes.find(c => c.id === r.s.classId);
        return `<div class="flex items-center gap-2.5">
          <span class="font-mono text-xs w-5" style="color:var(--text-faint)">#${i + 1}</span>
          ${avatarHtml(r.s, 30)}
          <div class="min-w-0 flex-1"><p class="text-sm font-semibold truncate">${esc(r.s.name)}</p><p class="text-xs" style="color:var(--text-muted)">${esc(cl?.name || '')} ${esc(cl?.section || '')}</p></div>
          <span class="pill" style="background:var(--present-soft);color:var(--present)">${r.st.pct}%</span>
        </div>`;
      }).join('')}</div>`;
    }
    function statCard(label, val, icon, color) {
      return `<div class="stat-card">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold" style="color:var(--text-muted)">${label}</span>
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${color}22"><i data-lucide="${icon}" style="width:14px;height:14px;color:${color}"></i></div>
    </div>
    <p class="font-display font-bold text-2xl">${val}</p>
  </div>`;
    }
    function pulseStrip() {
      let out = '';
      for (let back = 13; back >= 0; back--) {
        const d = new Date(); d.setDate(d.getDate() - back);
        const ds = todayStr(d);
        const hol = isHoliday(ds);
        let color = 'var(--border)';
        if (hol) color = 'var(--leave)';
        else {
          let p = 0, t = 0;
          Object.values(DATA.attendance[ds] || {}).forEach(cs => Object.values(cs).forEach(rec => Object.values(rec).forEach(s => { t++; if (s === 'present') p++; })));
          if (t > 0) color = p / t > 0.85 ? 'var(--present)' : p / t > 0.6 ? 'var(--half)' : 'var(--absent)';
        }
        out += `<div title="${fmtDate(ds)}${hol ? ' · ' + esc(hol.reason) : ''}" class="day-dot" style="background:${color}"></div>`;
      }
      return out;
    }
    function renderTrendChart() {
      const ctx = document.getElementById('trendChart'); if (!ctx) return;
      const labels = [], data = [];
      for (let back = 13; back >= 0; back--) {
        const d = new Date(); d.setDate(d.getDate() - back);
        const ds = todayStr(d);
        labels.push(fmtDateShort(ds));
        if (isHoliday(ds)) { data.push(null); continue; }
        let p = 0, t = 0;
        Object.values(DATA.attendance[ds] || {}).forEach(cs => Object.values(cs).forEach(rec => Object.values(rec).forEach(s => { t++; if (s === 'present' || s === 'half') p += s === 'half' ? 0.5 : 1; })));
        data.push(t ? Math.round((p / t) * 100) : null);
      }
      const styles = getComputedStyle(document.documentElement);
      new Chart(ctx, {
        type: 'line', data: { labels, datasets: [{ label: 'Attendance %', data, borderColor: styles.getPropertyValue('--primary'), backgroundColor: styles.getPropertyValue('--primary') + '22', fill: true, tension: .35, pointRadius: 3, spanGaps: true }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } } }
      });
    }

    /* =========================================================================
       STUDENTS
       ========================================================================= */
    function renderStudents() {
      const el = document.getElementById('page-content');
      el.innerHTML = `
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative flex-1 min-w-[180px]">
      <i data-lucide="search" style="width:15px;height:15px" class="absolute left-3 top-1/2 -translate-y-1/2" style="color:var(--text-faint)"></i>
      <input class="pl-8" placeholder="Search by name or roll no." value="${esc(UI.studentsSearch)}" oninput="App.setStudentsSearch(this.value)">
    </div>
    <select class="!w-auto" onchange="App.setStudentsFilter(this.value)">
      <option value="all" ${UI.studentsFilterClass === 'all' ? 'selected' : ''}>All Classes</option>
      ${DATA.classes.map(c => `<option value="${c.id}" ${UI.studentsFilterClass === c.id ? 'selected' : ''}>${esc(c.name)} ${esc(c.section)}</option>`).join('')}
    </select>
    <button class="btn btn-primary ml-auto" onclick="App.openStudentForm()"><i data-lucide="user-plus" style="width:15px;height:15px"></i>Add Student</button>
  </div>
  <div class="card overflow-x-auto">
    <table id="students-table"></table>
  </div>
  <div id="students-pagination" class="flex items-center justify-between mt-3 text-sm"></div>`;
      paintStudentsTable();
    }
    function setStudentsSearch(v) { UI.studentsSearch = v; UI.studentsPage = 1; paintStudentsTable(); }
    function setStudentsFilter(v) { UI.studentsFilterClass = v; UI.studentsPage = 1; paintStudentsTable(); }
    function filteredStudents() {
      const q = UI.studentsSearch.trim().toLowerCase();
      return DATA.students.filter(s => {
        if (UI.studentsFilterClass !== 'all' && s.classId !== UI.studentsFilterClass) return false;
        if (q && !(s.name.toLowerCase().includes(q) || String(s.roll).includes(q))) return false;
        return true;
      }).sort((a, b) => a.roll - b.roll);
    }
    function paintStudentsTable() {
      const PAGE_SIZE = 8;
      const all = filteredStudents();
      const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      UI.studentsPage = Math.min(UI.studentsPage, pages);
      const rows = all.slice((UI.studentsPage - 1) * PAGE_SIZE, UI.studentsPage * PAGE_SIZE);
      document.getElementById('students-table').innerHTML = `
    <thead><tr><th>Roll</th><th>Student</th><th>Class</th><th>Parent Contact</th><th>Fee</th><th></th></tr></thead>
    <tbody>${rows.map(s => {
        const cl = DATA.classes.find(c => c.id === s.classId);
        const feeStatus = feeStatusFor(s);
        return `<tr>
        <td class="font-mono">${s.roll}</td>
        <td><div class="flex items-center gap-2.5 cursor-pointer" onclick="App.viewStudent('${s.id}')">${avatarHtml(s)}<span class="font-semibold">${esc(s.name)}</span></div></td>
        <td>${esc(cl?.name || '—')} ${esc(cl?.section || '')}</td>
        <td class="text-xs">${esc(s.parentName)}<br><span style="color:var(--text-muted)">+${s.parentPhone}</span></td>
        <td>${feeBadge(feeStatus)}</td>
        <td><div class="flex items-center gap-1 justify-end">

    function studentAttendanceStats(studentId, fromDate, toDate) {
      const s = DATA.students.find(x => x.id === studentId);
      let present = 0, absent = 0, leave = 0, half = 0, late = 0, total = 0;
      Object.entries(DATA.attendance).forEach(([date, classes]) => {
        if (fromDate && date < fromDate) return;
        if (toDate && date > toDate) return;
        const classRec = classes[s.classId]; if (!classRec) return;
        Object.values(classRec).forEach(rec => {
          const st = rec[studentId]; if (!st) return;
          total++;
          if (st === 'present') present++; else if (st === 'absent') absent++; else if (st === 'leave') leave++; else if (st === 'half') half++; else if (st === 'late') late++;
        });
      });
      const pct = total ? Math.round(((present + half * 0.5) / total) * 100) : 0;
      return { present, absent, leave, half, late, total, pct };
    }

          ${Object.entries(STATUS_META).map(([key, m]) => `<div class="att-pill ${st === key ? 'sel-' + m.color : ''}" style="${editable ? '' : 'cursor:not-allowed;opacity:.7'}" ${editable ? `onclick="App.markStudent('${s.id}','${key}')"` : ''}>${m.abbr}</div>`).join('')}

    function chip(label, count, color) { return `<span class="pill" style="background:var(--${color}-soft);color:var(--${color})">${label}: ${count}</span>`; }
    function setAttClass(v) { UI.attendance.classId = v; renderAttendance(); }
    function setAttDate(v) { UI.attendance.date = v; paintAttBody(); }
    function setAttSession(v) { UI.attendance.session = v; paintAttBody(); }
    function ensureAttSlot(date, classId, session) {
      DATA.attendance[date] = DATA.attendance[date] || {};
      DATA.attendance[date][classId] = DATA.attendance[date][classId] || {};
      DATA.attendance[date][classId][session] = DATA.attendance[date][classId][session] || {};
      return DATA.attendance[date][classId][session];
    }
    function markStudent(studentId, status) {
      const { date, classId, session } = UI.attendance;
      if (isHoliday(date)) return;
      if (date !== todayStr()) { toast('Past attendance cannot be edited', { icon: 'lock', color: 'var(--absent)' }); return; }
      const rec = ensureAttSlot(date, classId, session);
      rec[studentId] = status;
      save(); paintAttBody();
    }
    function bulkMark(status) {
      const { date, classId, session } = UI.attendance;
      if (isHoliday(date)) return;
      if (date !== todayStr()) { toast('Past attendance cannot be edited', { icon: 'lock', color: 'var(--absent)' }); return; }
      const rec = ensureAttSlot(date, classId, session);
      DATA.students.filter(s => s.classId === classId).forEach(s => rec[s.id] = status);
      save(); paintAttBody();
      toast(`Marked all students ${status}`);
      addActivity(`Bulk marked ${DATA.classes.find(c => c.id === classId)?.name} as ${status} (${session})`, 'check-check');
    }

    function attendanceCalendarHtml() {
      UI.calMonth = UI.calMonth ?? new Date().getMonth();
      UI.calYear = UI.calYear ?? new Date().getFullYear();
      const classId = UI.attendance.classId;
      const first = new Date(UI.calYear, UI.calMonth, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(UI.calYear, UI.calMonth + 1, 0).getDate();
      const monthName = first.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
      const today = todayStr();
      let cells = '';
      for (let i = 0; i < startDow; i++) cells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const ds = `${UI.calYear}-${String(UI.calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hol = isHoliday(ds);
        const future = ds > today;
        const isToday = ds === today;
        let color = 'var(--surface-2)', label = 'No data', clickable = !future;
        if (hol) { color = 'var(--leave-soft)'; label = 'Holiday: ' + hol.reason; }
        else if (future) { label = 'Upcoming'; }
        else if (DATA.attendance[ds]?.[classId]) {
          let p = 0, t = 0;
          Object.values(DATA.attendance[ds][classId]).forEach(rec => Object.values(rec).forEach(s => { t++; if (s === 'present') p++; }));
          if (t > 0) {
            const pct = Math.round(p / t * 100);
            color = pct > 85 ? 'var(--present-soft)' : pct > 60 ? 'var(--half-soft)' : 'var(--absent-soft)';
            label = pct + '% present';
          }
        }
        cells += `<div class="rounded-xl p-2 text-left ${clickable ? 'cursor-pointer' : ''}" title="${esc(label)}"
        style="background:${color};min-height:64px;${future ? 'opacity:.45' : ''}${isToday ? ';outline:2px solid var(--primary);outline-offset:-2px' : ''}"
        ${clickable ? `onclick="App.jumpToMark('${ds}')"` : ''}>
      <span class="text-xs font-bold font-mono">${day}${isToday ? ' <span style=\'color:var(--primary)\'>•</span>' : ''}</span>
      <p class="text-[10px] mt-1 truncate" style="color:var(--text-muted)">${esc(label)}</p>
    </div>`;
      }
      const cl = DATA.classes.find(c => c.id === classId);
      const years = Array.from({ length: 3 }, (_, i) => new Date().getFullYear() - 1 + i); // last year, this year, next year
      return `
  <div class="card p-5">
    <div class="mb-4">
      <h3 class="font-display font-bold mb-1">Attendance Calendar</h3>
      <p class="text-xs" style="color:var(--text-muted)">Each date shows that day's attendance % for the selected class. Click a past or today's date to open/edit it. Future dates are locked until they arrive.</p>
    </div>
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <div><label>Class</label><select onchange="App.setAttClass(this.value)">${DATA.classes.map(c => `<option value="${c.id}" ${c.id === classId ? 'selected' : ''}>${esc(c.name)} ${esc(c.section)}</option>`).join('')}</select></div>
      <div class="flex items-center gap-1">
        <button class="btn btn-ghost btn-sm p-2" onclick="App.calMove(-1)"><i data-lucide="chevron-left" style="width:16px;height:16px"></i></button>
        <span class="font-display font-bold px-1 min-w-[150px] text-center">${monthName}</span>
        <button class="btn btn-ghost btn-sm p-2" onclick="App.calMove(1)"><i data-lucide="chevron-right" style="width:16px;height:16px"></i></button>
      </div>
      <select class="!w-auto !py-1.5" onchange="App.jumpToMonth(this.value)">
        ${Array.from({ length: 12 }, (_, m) => `<option value="${m}" ${m === UI.calMonth ? 'selected' : ''}>${new Date(2000, m, 1).toLocaleDateString('en-IN', { month: 'long' })}</option>`).join('')}
      </select>
      <select class="!w-auto !py-1.5" onchange="App.jumpToYear(this.value)">
        ${years.map(y => `<option value="${y}" ${y === UI.calYear ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" onclick="App.jumpToMonth(${new Date().getMonth()});App.jumpToYear(${new Date().getFullYear()})">Today</button>
    </div>
    <div class="flex flex-wrap items-center gap-4 text-xs mb-3" style="color:var(--text-muted)">
      <span class="flex items-center gap-1"><span class="badge-dot" style="background:var(--present)"></span>Good (&gt;85% present)</span>
      <span class="flex items-center gap-1"><span class="badge-dot" style="background:var(--half)"></span>Average (60–85% present)</span>
      <span class="flex items-center gap-1"><span class="badge-dot" style="background:var(--absent)"></span>Low (&lt;60% present)</span>
      <span class="flex items-center gap-1"><span class="badge-dot" style="background:var(--leave)"></span>Holiday</span>
      <span class="flex items-center gap-1"><span class="badge-dot" style="background:var(--surface-3,#ccc);border:1px solid var(--border)"></span>No data / Upcoming</span>
    </div>
    <div class="grid grid-cols-7 gap-1.5 mb-1 text-xs font-bold text-center" style="color:var(--text-faint)">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div>${d}</div>`).join('')}</div>
    <div class="grid grid-cols-7 gap-1.5">${cells}</div>
  </div>`;
    }
    function calMove(delta) {
      UI.calMonth += delta;
      if (UI.calMonth < 0) { UI.calMonth = 11; UI.calYear--; } if (UI.calMonth > 11) { UI.calMonth = 0; UI.calYear++; }
      paintAttBody();
    }
    function jumpToMonth(m) { UI.calMonth = parseInt(m); paintAttBody(); }
    function jumpToYear(y) { UI.calYear = parseInt(y); paintAttBody(); }
    function jumpToMark(ds) { if (ds > todayStr()) return; UI.attendance.date = ds; UI.attTab = 'mark'; renderAttendance(); }

    function attendanceHistoryHtml() {
      UI.histFilterClass = UI.histFilterClass || 'all';
      const rows = [];
      Object.entries(DATA.attendance).sort((a, b) => b[0].localeCompare(a[0])).forEach(([date, classes]) => {
        Object.entries(classes).forEach(([classId, sessions]) => {
          if (UI.histFilterClass !== 'all' && classId !== UI.histFilterClass) return;
          Object.entries(sessions).forEach(([session, rec]) => {
            const counts = { present: 0, absent: 0, leave: 0, half: 0, late: 0 };
            Object.values(rec).forEach(s => counts[s]++);
            rows.push({ date, classId, session, counts, total: Object.keys(rec).length });
          });
        });
      });
      return `
  <div class="flex items-center gap-2 mb-3">
    <select class="!w-auto" onchange="App.setHistFilter(this.value)">
      <option value="all">All Classes</option>
      ${DATA.classes.map(c => `<option value="${c.id}" ${UI.histFilterClass === c.id ? 'selected' : ''}>${esc(c.name)} ${esc(c.section)}</option>`).join('')}
    </select>
  </div>
  <div class="card overflow-x-auto">
    <table>
      <thead><tr><th>Date</th><th>Class</th><th>Session</th><th>Present</th><th>Absent</th><th>Leave</th><th>Half</th><th>Late</th><th>Total</th></tr></thead>
      <tbody>${rows.slice(0, 60).map(r => {
        const cl = DATA.classes.find(c => c.id === r.classId);
        return `<tr><td>${fmtDate(r.date)}</td><td>${esc(cl?.name)} ${esc(cl?.section)}</td><td class="capitalize">${r.session}</td>
        <td style="color:var(--present)">${r.counts.present}</td><td style="color:var(--absent)">${r.counts.absent}</td>
        <td style="color:var(--leave)">${r.counts.leave}</td><td style="color:var(--half)">${r.counts.half}</td><td style="color:var(--late)">${r.counts.late}</td>
        <td class="font-mono">${r.total}</td></tr>`;
      }).join('') || `<tr><td colspan="9" class="text-center py-8" style="color:var(--text-muted)">No attendance records yet</td></tr>`}</tbody>
    </table>
  </div>`;
    }
    function setHistFilter(v) { UI.histFilterClass = v; paintAttBody(); }

    function openLeaveForm() {

    <div class="space-y-3">
      <div><label>Student</label><select id="lf-student">${DATA.students.sort((a, b) => a.roll - b.roll).map(s => `<option value="${s.id}">${esc(s.name)} (Roll ${s.roll})</option>`).join('')}</select></div>

    function saveLeave() {
      const studentId = document.getElementById('lf-student').value;
      const from = document.getElementById('lf-from').value;
      const to = document.getElementById('lf-to').value;
      const type = document.getElementById('lf-type').value;

    /* =========================================================================
       MARKS MANAGEMENT
       ========================================================================= */
    function gradeFor(pct) {
      if (pct >= 90) return 'A+'; if (pct >= 80) return 'A'; if (pct >= 70) return 'B'; if (pct >= 60) return 'C'; if (pct >= 50) return 'D'; return 'F';
    }
    function renderMarks() {
      UI.marksFilterClass = UI.marksFilterClass || 'all';
      UI.marksSearch = UI.marksSearch || '';
      const el = document.getElementById('page-content');
      el.innerHTML = `
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative flex-1 min-w-[180px]">
      <i data-lucide="search" style="width:15px;height:15px" class="absolute left-3 top-1/2 -translate-y-1/2" style="color:var(--text-faint)"></i>
      <input class="pl-8" placeholder="Search by name or roll no." value="${esc(UI.marksSearch)}" oninput="App.setMarksSearch(this.value)">
    </div>
    <select class="!w-auto" onchange="App.setMarksFilter(this.value)">
      <option value="all">All Classes</option>
      ${DATA.classes.map(c => `<option value="${c.id}" ${UI.marksFilterClass === c.id ? 'selected' : ''}>${esc(c.name)} ${esc(c.section)}</option>`).join('')}
    </select>
    <button class="btn btn-outline" onclick="App.openSubjectForm()"><i data-lucide="book-plus" style="width:15px;height:15px"></i>Add Subject</button>
    <button class="btn btn-primary ml-auto" onclick="App.openMarksForm()"><i data-lucide="plus" style="width:15px;height:15px"></i>Add Marks</button>
  </div>
  <div id="marks-table-wrap"></div>`;
      paintMarksTable();
    }
    function setMarksFilter(v) { UI.marksFilterClass = v; paintMarksTable(); }
    function setMarksSearch(v) { UI.marksSearch = v; paintMarksTable(); }
    function paintMarksTable() {
      const q = (UI.marksSearch || '').trim().toLowerCase();
      let rows = DATA.students.filter(s => UI.marksFilterClass === 'all' || s.classId === UI.marksFilterClass);
      if (q) rows = rows.filter(s => s.name.toLowerCase().includes(q) || String(s.roll).includes(q));
      const withStats = rows.map(s => {
        const stuMarks = DATA.marks.filter(m => m.studentId === s.id);
        let totalScore = 0, totalMax = 0, lastUpdated = null, anyEdited = false;
        stuMarks.forEach(m => {
          totalScore += m.score; totalMax += m.maxScore;
          if (m.edited) anyEdited = true;
          if (m.updatedAt && (!lastUpdated || m.updatedAt > lastUpdated)) lastUpdated = m.updatedAt;
        });
        const pct = totalMax ? Math.round(totalScore / totalMax * 100) : 0;
        return { s, totalMax, pct, lastUpdated, anyEdited };
      });
      withStats.sort((a, b) => {
        if (a.anyEdited !== b.anyEdited) return a.anyEdited ? -1 : 1;
        if (a.anyEdited && b.anyEdited) return (b.lastUpdated || '').localeCompare(a.lastUpdated || '');
        return a.s.roll - b.s.roll;
      });
      document.getElementById('marks-table-wrap').innerHTML = `
  <div class="card overflow-x-auto">
    <table>
      <thead><tr><th>Roll</th><th>Student</th><th>Class</th><th>Total %</th><th>Grade</th><th>Status</th><th></th></tr></thead>
      <tbody>${withStats.map(({ s, totalMax, pct, lastUpdated, anyEdited }) => {
        const cl = DATA.classes.find(c => c.id === s.classId);
        return `<tr>
        <td class="font-mono">${s.roll}</td>
        <td><div class="flex items-center gap-2">${avatarHtml(s, 28)}<span class="font-semibold">${esc(s.name)}</span></div></td>
        <td>${esc(cl?.name || '—')} ${esc(cl?.section || '')}</td>
        <td class="font-mono font-bold">${totalMax ? pct + '%' : '—'}</td>
        <td>${totalMax ? `<span class="pill" style="background:var(--primary-soft);color:var(--primary)">${gradeFor(pct)}</span>` : '—'}</td>
        <td>${anyEdited ? `<span class="pill" style="background:var(--leave-soft);color:var(--leave)" title="${new Date(lastUpdated).toLocaleString('en-IN')}"><i data-lucide="pencil" style="width:11px;height:11px"></i>Updated</span>` : (totalMax ? `<span class="pill" style="background:var(--surface-2);color:var(--text-muted)">Recorded</span>` : `<span class="pill" style="background:var(--surface-2);color:var(--text-muted)">No data</span>`)}</td>
        <td><div class="flex items-center gap-1 justify-end">
          <button class="btn btn-ghost btn-sm p-1.5" onclick="App.openStudentMarksManager('${s.id}')" title="Edit marks"><i data-lucide="pencil" style="width:14px;height:14px"></i></button>
          <button class="btn btn-ghost btn-sm p-1.5" onclick="App.deleteStudentMarks('${s.id}')" title="Delete all marks"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--absent)"></i></button>
        </div></td>
      </tr>`;
      }).join('') || `<tr><td colspan="7" class="text-center py-8" style="color:var(--text-muted)">No students found</td></tr>`}</tbody>
    </table>
  </div>`;
      icons();
    }
    function openStudentMarksManager(studentId) {
      const s = DATA.students.find(x => x.id === studentId); if (!s) return;
      const cl = DATA.classes.find(c => c.id === s.classId);
      const stuMarks = DATA.marks.filter(m => m.studentId === studentId).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      openModal(`<div class="p-6">
    <div class="flex items-center justify-between mb-4">
      <div><h3 class="font-display font-bold text-lg">${esc(s.name)}'s Marks</h3><p class="text-xs" style="color:var(--text-muted)">Roll ${s.roll} · ${esc(cl?.name || '')} ${esc(cl?.section || '')}</p></div>
      <button class="btn btn-primary btn-sm" onclick="App.openMarksForm({studentId:'${studentId}'})"><i data-lucide="plus" style="width:13px;height:13px"></i>Add</button>
    </div>
    <div class="card overflow-x-auto">
      <table>
        <thead><tr><th>Subject</th><th>Exam</th><th>Score</th><th></th><th></th></tr></thead>

        return `<tr>
            <td>${esc(sub?.name || '—')}</td>
            <td>${esc(m.examType)}${m.edited ? ` <span class="pill" style="background:var(--leave-soft);color:var(--leave)">Updated</span>` : ''}</td>
            <td class="font-mono">${m.score}/${m.maxScore}</td>
            <td><button class="btn btn-ghost btn-sm p-1.5" onclick="App.closeModal();App.openMarksForm({studentId:'${studentId}', subjectId:'${m.subjectId}', examType:'${esc(m.examType)}', score:${m.score}, maxScore:${m.maxScore}, markId:'${m.id}'})"><i data-lucide="pencil" style="width:14px;height:14px"></i></button></td>
            <td><button class="btn btn-ghost btn-sm p-1.5" onclick="App.deleteMarkEntry('${m.id}','${studentId}')"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--absent)"></i></button></td>
          </tr>`;

      </table>
    </div>
    <div class="flex justify-end mt-5"><button class="btn btn-outline" onclick="App.closeModal()">Close</button></div>
  </div>`);
    }
    function deleteMarkEntry(markId, studentId) {
      DATA.marks = DATA.marks.filter(m => m.id !== markId);
      save(); toast('Marks entry deleted', { icon: 'trash-2', color: 'var(--absent)' });
      closeModal(); openStudentMarksManager(studentId); paintMarksTable();
    }
    function deleteStudentMarks(studentId) {
      const s = DATA.students.find(x => x.id === studentId);
      openModal(`<div class="p-6">
    <h3 class="font-display font-bold text-lg mb-2">Delete all marks for ${esc(s?.name || 'student')}?</h3>
    <p class="text-sm mb-5" style="color:var(--text-muted)">This will remove every recorded mark for this student. This cannot be undone.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-outline" onclick="App.closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="App.confirmDeleteStudentMarks('${studentId}')"><i data-lucide="trash-2" style="width:15px;height:15px"></i>Yes, Delete</button>
    </div>
  </div>`);
    }

    function saveMarks(lockedStudentId) {
      const studentId = lockedStudentId || document.getElementById('mf-student').value;
      if (!studentId) { toast('Please select a student', { icon: 'alert-circle', color: 'var(--absent)' }); return; }
      const subjectName = document.getElementById('mf-subject-name').value.trim();
      if (!subjectName) { toast('Please enter a subject name', { icon: 'alert-circle', color: 'var(--absent)' }); return; }
      let subj = DATA.subjects.find(x => x.name.toLowerCase() === subjectName.toLowerCase());
      if (!subj) { subj = { id: uid('sub'), name: subjectName }; DATA.subjects.push(subj); }
      const subjectId = subj.id;
      const examType = document.getElementById('mf-exam').value;
      const score = parseFloat(document.getElementById('mf-score').value) || 0;
      const maxScore = parseFloat(document.getElementById('mf-max').value) || 100;
      const existing = DATA.marks.find(m => m.studentId === studentId && m.subjectId === subjectId && m.examType === examType);
      const now = new Date().toISOString();
      const wasUpdate = !!existing;
      if (existing) { existing.score = score; existing.maxScore = maxScore; existing.updatedAt = now; existing.edited = true; }
      else DATA.marks.push({ id: uid('mk'), studentId, subjectId, examType, score, maxScore, updatedAt: now, edited: false });
      save(); closeModal(); renderMarks();
      const stu = DATA.students.find(s => s.id === studentId);
      toast(wasUpdate ? `Marks updated for ${stu?.name || 'student'}` : 'Marks saved');
      addActivity(`${wasUpdate ? 'Updated' : 'Added'} marks for ${stu?.name || 'student'}`, 'graduation-cap');
    }

    function pdfHeader(doc, title) {
      doc.setFontSize(14); doc.setFont(undefined, 'bold'); doc.text(DATA.meta.schoolName, 40, 40);
      doc.setFontSize(11); doc.setFont(undefined, 'normal'); doc.text(title, 40, 58);
      doc.setDrawColor(200); doc.line(40, 66, 555, 66);
      return 86;
    }
    function pdfTable(doc, y, head, rows, colWidths) {
      const startX = 40; doc.setFontSize(9); doc.setFont(undefined, 'bold');
      let x = startX;
      head.forEach((h, i) => { doc.text(String(h), x, y); x += colWidths[i]; });
      y += 6; doc.setDrawColor(220); doc.line(startX, y, startX + colWidths.reduce((a, b) => a + b, 0), y); y += 14;
      doc.setFont(undefined, 'normal');
      rows.forEach(row => {
        if (y > 760) { doc.addPage(); y = 40; }
        x = startX;
        row.forEach((cell, i) => { doc.text(String(cell), x, y); x += colWidths[i]; });
        y += 16;
      });
      return y;
    }
    function downloadPdf(doc, filename) { doc.save(filename); toast('PDF downloaded', { icon: 'file-down' }); }
    function downloadExcel(rows, filename, sheetName) {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
      XLSX.writeFile(wb, filename);
      toast('Excel file downloaded', { icon: 'file-down' });
    }

    function exportClassReportPDF() {
      const cls = DATA.classes.find(c => c.id === UI.repClass);
      const students = DATA.students.filter(s => s.classId === UI.repClass).sort((a, b) => a.roll - b.roll);
      const doc = new window.jspdf.jsPDF();
      let y = pdfHeader(doc, `Attendance Report — ${cls.name} ${cls.section} (${fmtDate(UI.repFrom)} to ${fmtDate(UI.repTo)})`);
      const rows = students.map(s => { const st = studentAttendanceStats(s.id, UI.repFrom, UI.repTo); return [s.roll, s.name, st.present, st.absent, st.leave, st.half, st.late, st.pct + '%']; });
      pdfTable(doc, y, ['Roll', 'Name', 'P', 'A', 'L', 'H', 'Lt', '%'], rows, [35, 170, 30, 30, 30, 30, 30, 40]);
      downloadPdf(doc, `attendance_${cls.name}_${cls.section}.pdf`.replace(/\s+/g, '_'));
    }
    function exportClassReportExcel() {
      const cls = DATA.classes.find(c => c.id === UI.repClass);
      const students = DATA.students.filter(s => s.classId === UI.repClass).sort((a, b) => a.roll - b.roll);
      const rows = students.map(s => { const st = studentAttendanceStats(s.id, UI.repFrom, UI.repTo); return { Roll: s.roll, Name: s.name, Present: st.present, Absent: st.absent, Leave: st.leave, Half: st.half, Late: st.late, 'Attendance %': st.pct }; });
      downloadExcel(rows, `attendance_${cls.name}_${cls.section}.xlsx`.replace(/\s+/g, '_'), 'Attendance');
    }
    function exportLeaderboardPDF() {
      const rows = DATA.students.map(s => ({ s, st: studentAttendanceStats(s.id) })).filter(r => r.st.total > 0).sort((a, b) => b.st.pct - a.st.pct);
      const doc = new window.jspdf.jsPDF();
      let y = pdfHeader(doc, 'Attendance Leaderboard');
      pdfTable(doc, y, ['Rank', 'Name', 'Class', '%'], rows.map((r, i) => { const cl = DATA.classes.find(c => c.id === r.s.classId); return [i + 1, r.s.name, `${cl?.name} ${cl?.section}`, r.st.pct + '%']; }), [40, 200, 150, 50]);
      downloadPdf(doc, 'attendance_leaderboard.pdf');
    }
    function exportLeaderboardExcel() {
      const rows = DATA.students.map(s => ({ s, st: studentAttendanceStats(s.id) })).filter(r => r.st.total > 0).sort((a, b) => b.st.pct - a.st.pct);
      downloadExcel(rows.map((r, i) => { const cl = DATA.classes.find(c => c.id === r.s.classId); return { Rank: i + 1, Name: r.s.name, Class: `${cl?.name} ${cl?.section}`, 'Attendance %': r.st.pct }; }), 'attendance_leaderboard.xlsx', 'Leaderboard');
    }
    function exportLocPDF() {
      const cls = DATA.classes.find(c => c.id === UI.locClass);
      const students = DATA.students.filter(s => s.classId === UI.locClass).sort((a, b) => a.roll - b.roll);
      const doc = new window.jspdf.jsPDF();
      let y = pdfHeader(doc, `List of Candidates — ${cls.name} ${cls.section}`);
      pdfTable(doc, y, ['Roll', 'Name', 'Parent/Guardian', 'Class'], students.map(s => [s.roll, s.name, s.parentName, `${cls.name} ${cls.section}`]), [40, 170, 220, 80]);
      downloadPdf(doc, `LOC_${cls.name}_${cls.section}.pdf`.replace(/\s+/g, '_'));
    }
    function exportLocExcel() {
      const cls = DATA.classes.find(c => c.id === UI.locClass);
      const students = DATA.students.filter(s => s.classId === UI.locClass).sort((a, b) => a.roll - b.roll);
      downloadExcel(students.map(s => ({ 'Roll No': s.roll, 'Candidate Name': s.name, 'Parent/Guardian': s.parentName, Class: `${cls.name} ${cls.section}` })), `LOC_${cls.name}_${cls.section}.xlsx`.replace(/\s+/g, '_'), 'LOC');
    }
    function exportStudentPDF(id) {
      const s = DATA.students.find(x => x.id === id); const cl = DATA.classes.find(c => c.id === s.classId);
      const st = studentAttendanceStats(id); const stuMarks = DATA.marks.filter(m => m.studentId === id);
      const doc = new window.jspdf.jsPDF();
      let y = pdfHeader(doc, `Student Report — ${s.name} (Roll ${s.roll}, ${cl?.name} ${cl?.section})`);
      doc.setFontSize(10);
      doc.text(`Attendance: ${st.pct}%  |  Present:${st.present} Absent:${st.absent} Leave:${st.leave} Half:${st.half} Late:${st.late}`, 40, y); y += 20;
      doc.text(`Fee Status: ${feeStatusFor(s)}`, 40, y); y += 20;
      y = pdfTable(doc, y + 10, ['Subject', 'Exam', 'Score'], stuMarks.map(m => { const sub = DATA.subjects.find(x => x.id === m.subjectId); return [sub?.name, m.examType, `${m.score}/${m.maxScore}`]; }), [200, 150, 100]);
      downloadPdf(doc, `report_${s.name}.pdf`.replace(/\s+/g, '_'));
    }
    function exportStudentExcel(id) {
      const s = DATA.students.find(x => x.id === id); const st = studentAttendanceStats(id);
      const stuMarks = DATA.marks.filter(m => m.studentId === id).map(m => { const sub = DATA.subjects.find(x => x.id === m.subjectId); return { Subject: sub?.name, Exam: m.examType, Score: m.score, Max: m.maxScore }; });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ Name: s.name, Roll: s.roll, 'Attendance %': st.pct, Present: st.present, Absent: st.absent, Leave: st.leave, Half: st.half, Late: st.late, Fee: feeStatusFor(s) }]), 'Summary');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stuMarks.length ? stuMarks : [{ Subject: '—', Exam: '—', Score: '—', Max: '—' }]), 'Marks');
      XLSX.writeFile(wb, `report_${s.name}.xlsx`.replace(/\s+/g, '_'));
      toast('Excel file downloaded', { icon: 'file-down' });
    }
    function shareStudentWhatsApp(id) {
      const s = DATA.students.find(x => x.id === id);
      const st = studentAttendanceStats(id);
      const stuMarks = DATA.marks.filter(m => m.studentId === id);
      const totalScore = stuMarks.reduce((a, m) => a + m.score, 0), totalMax = stuMarks.reduce((a, m) => a + m.maxScore, 0);
      const marksPct = totalMax ? Math.round(totalScore / totalMax * 100) : 0;
      exportStudentExcel(id);
      const msg = `Hello, this is an update from ${DATA.meta.schoolName} regarding *${s.name}* (Roll ${s.roll}):\n\n📊 Attendance: ${st.pct}%\n📚 Marks Average: ${marksPct}%\n💰 Fee Status: ${feeStatusFor(s)}\n\nA detailed report has been prepared and downloaded — please find it attached separately.`;
      const url = `https://wa.me/${s.parentPhone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
      addActivity(`Shared report for ${s.name} via WhatsApp`, 'message-circle');
    }

    /* =========================================================================
       SETTINGS
       ========================================================================= */
    function renderSettings() {
      const el = document.getElementById('page-content');
      el.innerHTML = `
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="card p-5" id="settings-form">
      <h3 class="font-display font-bold mb-4">School Profile</h3>
      <div class="flex items-center gap-3 mb-4">
        <div id="logo-preview">${DATA.meta.logo ? `<img src="${DATA.meta.logo}" class="avatar" style="width:52px;height:52px">` : `<div class="avatar-fallback" style="width:52px;height:52px;background:var(--primary)"><i data-lucide="school" style="width:22px;height:22px"></i></div>`}</div>
        <div class="flex-1"><label>School Logo</label><input type="file" accept="image/*" onchange="App.previewLogo(this)"></div>
        <button type="button" class="btn btn-danger btn-sm" id="logo-remove-btn" style="${DATA.meta.logo ? '' : 'display:none'}" onclick="App.removeLogo()"><i data-lucide="trash-2" style="width:13px;height:13px"></i>Remove</button>
      </div>
      <label>School Name</label><input id="set-school" value="${esc(DATA.meta.schoolName)}">
      <div class="mt-4"><label>Developer Credit</label><input id="set-dev" value="${esc(DATA.meta.developerName)}" placeholder="Your Name"></div>
      <button class="btn btn-primary mt-4" onclick="App.saveSettings()"><i data-lucide="save" style="width:15px;height:15px"></i>Save Settings</button>
    </div>
    <div class="card p-5">
      <h3 class="font-display font-bold mb-4">Appearance</h3>
      <div class="flex items-center justify-between p-3 rounded-xl" style="background:var(--surface-2)">
        <div><p class="font-semibold text-sm">Dark Mode</p><p class="text-xs" style="color:var(--text-muted)">Switch the entire interface theme</p></div>
        <button class="btn btn-outline btn-sm" onclick="App.toggleTheme()">Toggle</button>
      </div>
      <h3 class="font-display font-bold mt-6 mb-3">Data Management</h3>
      <div class="flex flex-col gap-2">
        <button class="btn btn-outline" onclick="App.exportBackup()"><i data-lucide="download" style="width:15px;height:15px"></i>Export Full Backup (JSON)</button>
        <button class="btn btn-danger" onclick="App.clearData()"><i data-lucide="trash-2" style="width:15px;height:15px"></i>Clear All Data</button>
      </div>
      <p class="text-xs mt-4" style="color:var(--text-faint)">Developed by ${esc(DATA.meta.developerName)} · AttendEase Pro Prototype v1.0</p>
    </div>
  </div>`;
    }
    let _pendingLogo = null; // dataURL = new logo, 'REMOVE' = remove existing, null = no change
    function previewLogo(input) {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        _pendingLogo = e.target.result;
        document.getElementById('logo-preview').innerHTML = `<img src="${_pendingLogo}" class="avatar" style="width:52px;height:52px">`;
        const btn = document.getElementById('logo-remove-btn'); if (btn) btn.style.display = '';
      };
      reader.readAsDataURL(file);
    }
    function removeLogo() {
      _pendingLogo = 'REMOVE';
      document.getElementById('logo-preview').innerHTML = `<div class="avatar-fallback" style="width:52px;height:52px;background:var(--primary)"><i data-lucide="school" style="width:22px;height:22px"></i></div>`;
      const btn = document.getElementById('logo-remove-btn'); if (btn) btn.style.display = 'none';
      icons();
    }
    function saveSettings() {
      DATA.meta.schoolName = document.getElementById('set-school').value.trim() || DATA.meta.schoolName;
      DATA.meta.developerName = document.getElementById('set-dev').value.trim() || DATA.meta.developerName;
      if (_pendingLogo === 'REMOVE') DATA.meta.logo = null;
      else if (_pendingLogo) DATA.meta.logo = _pendingLogo;
      _pendingLogo = null;
      save(); toast('Settings saved'); buildNav();
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'attendease_backup.json'; a.click();
      toast('Backup exported');
    }
    function clearData() {
      openModal(`<div class="p-6">
    <h3 class="font-display font-bold text-lg mb-2">Clear All Data?</h3>
    <p class="text-sm mb-5" style="color:var(--text-muted)">This will permanently delete all students, attendance, marks, and fee records from this browser, and reload fresh sample data.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-outline" onclick="App.closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="App.confirmClearData()"><i data-lucide="trash-2" style="width:15px;height:15px"></i>Yes, Clear Everything</button>
    </div>
  </div>`);
    }
    function confirmClearData() {
      localStorage.removeItem(STORAGE_KEY);
      seedData(); closeModal(); nav('dashboard'); toast('All data cleared and reset');
    }

    /* =========================================================================
       INIT
       ========================================================================= */
    window.App = {
      toggleAuthMode, authSubmit, demoLogin, logout,
      nav, openSidebar, closeSidebar, toggleTheme, closeModal, globalSearch,
      setStudentsSearch, setStudentsFilter, studentsPageGo, openStudentForm, previewPhoto, removePhoto, saveStudent, deleteStudent, viewStudent,
      renderStreamSubjects, toggleStreamFieldForClass,
      openClassForm, saveClass, deleteClass, openHolidayForm, saveHoliday, deleteHoliday,
      attTabGo, setAttClass, setAttDate, setAttSession, markStudent, bulkMark, calMove, jumpToMonth, jumpToYear, jumpToMark, setHistFilter,
      openLeaveForm, saveLeave, setLeaveStatus, deleteLeave,
      setMarksFilter, setMarksSearch, filterMarksStudentSelect, openSubjectForm, saveSubject, openMarksForm, saveMarks,
      openStudentMarksManager, deleteMarkEntry, deleteStudentMarks, confirmDeleteStudentMarks,
      openFeeForm, saveFee,
      reportsTabGo, setRepClass, setRepRange, setRepStudent, setLocClass,
      exportClassReportPDF, exportClassReportExcel, exportLeaderboardPDF, exportLeaderboardExcel, exportLocPDF, exportLocExcel, exportStudentPDF, exportStudentExcel, shareStudentWhatsApp,
      exportAllStudentsPDF, exportAllStudentsExcel,
      previewLogo, removeLogo, saveSettings, exportBackup, clearData, confirmClearData,
    };

    (function init() {
      const sess = localStorage.getItem(SESSION_KEY);
      loadData();
      applyTheme(DATA.meta.theme || 'light');
      icons();
      if (sess) {
        SESSION = JSON.parse(sess);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-shell').style.display = 'block';
        document.getElementById('sb-name').textContent = SESSION.name;
        document.getElementById('sb-email').textContent = SESSION.email;
        document.getElementById('sb-avatar').textContent = initials(SESSION.name);
        document.getElementById('sb-avatar').style.background = colorFor(SESSION.email);
        buildNav();
        let lastPage = 'dashboard';
        try { lastPage = localStorage.getItem(LAST_PAGE_KEY) || 'dashboard'; } catch (e) { }
        if (!NAV_ITEMS.some(it => it.id === lastPage)) lastPage = 'dashboard';
        nav(lastPage);
      } else {
        icons();
      }
    })();
  </script>
</body>
